name: RecallLab checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20.20.2'
          cache: npm
      - run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=moderate
      - name: Fixture reproducibility, types, lint, formatting, unit tests and build
        run: npm run check
      - name: Diagnose new-test formatter diff
        if: failure()
        run: |
          npx prettier --write tests/e2e/import.spec.ts
          git diff -- tests/e2e/import.spec.ts
      - name: Install isolated browser
        run: npx playwright install --with-deps chromium firefox
      - name: Browser acceptance on port 5174 / RecallLab-test
        run: npm run test:e2e
      - name: Firefox learning, concurrency, scale and Chinese PDF acceptance
        run: npm run test:firefox
      - name: Built PDF resources and offline OCR acceptance
        run: npm run test:production
      - name: Commit-associated test summary
        if: always()
        run: npm run test:summary
        env:
          RECALLLAB_REVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            playwright-report/
            test-results/
            !test-results/**/profile/**
            !test-results/**/browser-profile/**
          retention-days: 14
          if-no-files-found: warn
